name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller + Pillow
        run: python -m pip install --upgrade pyinstaller pillow

      - name: Build the exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ReyYouTubeDownloader" --icon "icon.ico" --add-data "logo.png;." --add-data "icon.ico;." --exclude-module tkinter.test "yt_gui.py"

      - name: Make the portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "portable" -Force | Out-Null
          Copy-Item "dist\ReyYouTubeDownloader.exe" "portable\"
          # bundle the yt-dlp engine (it is gitignored, so fetch it here)
          if (-not (Test-Path "yt-dlp.exe")) {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "portable\yt-dlp.exe"
          } else {
            Copy-Item "yt-dlp.exe" "portable\"
          }
          # bundle ffmpeg (for merging / conversion) so the folder is self-contained
          $ff = Join-Path $env:TEMP "rey_ff"
          $z = Join-Path $env:TEMP "rey_ff.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile $z
          Expand-Archive -Path $z -DestinationPath $ff -Force
          New-Item -ItemType Directory -Path "portable\ffmpeg" -Force | Out-Null
          (Get-ChildItem $ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).CopyTo("portable\ffmpeg\ffmpeg.exe")
          Compress-Archive -Path "portable\*" -DestinationPath "ReyYouTubeDownloader-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReyYouTubeDownloader-windows
          path: |
            dist\ReyYouTubeDownloader.exe
            ReyYouTubeDownloader-portable.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\ReyYouTubeDownloader.exe
            ReyYouTubeDownloader-portable.zip
          generate_release_notes: true
